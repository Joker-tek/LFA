<!DOCTYPE html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Felfedezés – Sorsfonál</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,600&family=Figtree:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="script.js"></script></head><body><div class="wrap"><header><a class="logo" href="index.html">Sors<i>fonál</i></a><nav><a href="felfedezes.html">Felfedezés</a><a href="profil.html">Profil</a><a href="premium.html">Premium</a><a class="btn" href="belepes.html">Belépés</a></nav></header>
<main><h1 class="sub" style="font-size:2.6rem;margin-bottom:0">Ismerkedj</h1>
<p class="sub muted" id="left"></p>
<div class="deck" id="deck"></div>
<div class="vote"><button class="big" id="no" aria-label="Nem">✕</button><button class="big yes" id="yes" aria-label="Igen">♥</button></div>
<p class="sub muted">Húzd a képet, vagy használd a nyilakat (← nem, → igen).</p>
<p class="sub msg" id="note" role="status"></p></main></div>
<script>
const P=[
['Anna',27,3,'Hegyekben nyaralok, otthon főzök. Olyat keresek, akivel lehet nevetni.',['utazás','főzés','természet'],['pop','népzene'],'#B3122E',1],
['Bence',29,8,'Kosárlabda, gitár, jó beszélgetés egy pohár tea mellett.',['sport','zene','humor'],['rock','jazz'],'#6E0B1D',0],
['Réka',25,5,'Fényképezek, kávét iszom, és mindig van nálam egy könyv.',['fotózás','könyvek','utazás'],['elektronikus','pop'],'#8C1530',1],
['Dani',31,12,'Kerékpár, sütés, régi filmek. Vasárnap a legjobb nap.',['sport','film','főzés'],['rock','metál'],'#4A0A15',0],
['Lilla',26,2,'Koncertek, könyvek, hosszú esti séták a városban.',['zene','könyvek','film'],['jazz','klasszikus'],'#A3162F',0],
['Márk',30,15,'Futok, utazom, nyelveket tanulok. Hirtelen ötletekre mindig nyitott vagyok.',['sport','utazás','játékok'],['hip-hop','elektronikus'],'#5C0C1B',1],
['Zsófi',28,6,'Zongorázom, süteményt sütök, és szeretem a csendes estéket.',['zene','főzés','természet'],['klasszikus','jazz'],'#C21F3B',0],
['Tamás',32,9,'Túrák, fotózás, vasárnapi főzés a barátokkal.',['természet','fotózás','főzés'],['népzene','rock'],'#7A0F22',0]];
const S=load('sf_set',{}),me=load('sf_profile',{}),mine=(me.interests||[]).concat(me.genres||[]);
const deck=P.filter(p=>p[1]>=(S.min||18)&&p[1]<=(S.max||99));
const today=()=>new Date().toISOString().slice(0,10);
const prem=()=>load('sf_premium',false);
const used=()=>{const d=load('sf_likes',{});return d.day===today()?d.n:0};
const cap=()=>prem()?Infinity:10;
let i=0;
const el=id=>document.getElementById(id);
function left(){el('left').innerHTML=prem()?'Korlátlan lájk <span class="badge">Prémium</span>':'Mára még '+(cap()-used())+' lájkod van. <a href="premium.html">Több kell?</a>'}
function cardHtml(p){
 const common=p[4].concat(p[5]).filter(x=>mine.includes(x));
 return '<div class="stamp y">IGEN</div><div class="stamp n">NEM</div><div class="pic" style="background:linear-gradient(160deg,'+p[6]+',#0D0406)">'+p[0][0]+'</div><div class="info"><h2>'+p[0]+', '+p[1]+'</h2><div class="row2">'+(S.hideDist?'':p[2]+' km · ')+(common.length?common.length+' közös érdeklődés':'új ismerős')+'</div><p style="font-size:.95rem">'+p[3]+'</p><div class="tags" style="margin-top:8px">'+p[4].map(x=>'<span>'+x+'</span>').join('')+p[5].map(x=>'<span>♪ '+x+'</span>').join('')+'</div></div>';
}
function render(){
 left();const d=el('deck');d.innerHTML='';
 if(i>=deck.length){d.innerHTML='<div class="empty"><div><h2>Mára elfogytak a profilok</h2><p class="muted">Szélesítsd a korhatárt a <a href="profil.html">beállításokban</a>, vagy nézz vissza később.</p></div></div>';el('yes').disabled=el('no').disabled=true;return}
 if(deck[i+1]){const b=document.createElement('div');b.className='sw back';b.innerHTML=cardHtml(deck[i+1]);d.appendChild(b)}
 const c=document.createElement('div');c.className='sw';c.innerHTML=cardHtml(deck[i]);d.appendChild(c);drag(c);
}
function decide(yes){
 const c=document.querySelector('.sw:not(.back)');if(!c)return;
 el('note').textContent='';
 if(yes&&used()>=cap()){el('note').innerHTML='Elfogyott a mai lájkod. A Prémiummal korlátlan lájkod lesz. <a href="premium.html">Megnézem</a>';c.style.transform='';return}
 const p=deck[i];
 if(yes)save('sf_likes',{day:today(),n:used()+1});
 c.style.transform='translateX('+(yes?'140%':'-140%')+') rotate('+(yes?18:-18)+'deg)';c.style.opacity=0;
 setTimeout(()=>{i++;render();if(yes&&p[7])match(p)},300);
}
function match(p){
 const o=document.createElement('div');o.className='overlay';
 o.innerHTML='<div><h2>Egyezés!</h2><p>Te és '+p[0]+' kölcsönösen tetszetek egymásnak.</p><p style="margin-top:20px"><button class="btn">Tovább</button></p></div>';
 o.querySelector('button').onclick=()=>o.remove();document.body.appendChild(o);
}
function drag(c){let x0=null,dx=0;
 const yS=c.querySelector('.y'),nS=c.querySelector('.n');
 c.onpointerdown=e=>{x0=e.clientX;c.setPointerCapture(e.pointerId);c.style.transition='none'};
 c.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;c.style.transform='translateX('+dx+'px) rotate('+dx/20+'deg)';yS.style.opacity=Math.max(0,dx/120);nS.style.opacity=Math.max(0,-dx/120)};
 c.onpointerup=()=>{if(x0===null)return;x0=null;c.style.transition='';if(Math.abs(dx)>110){decide(dx>0)}else{c.style.transform='';yS.style.opacity=nS.style.opacity=0}dx=0};
}
el('yes').onclick=()=>decide(true);el('no').onclick=()=>decide(false);
document.onkeydown=e=>{if(e.key==='ArrowRight')decide(true);if(e.key==='ArrowLeft')decide(false)};
render();
</script></body></html>
