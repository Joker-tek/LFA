<!DOCTYPE html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belépés – Sorsfonál</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body><div class="wrap">
<header><a class="logo" href="index.html">Sors<i>fonál</i></a><nav><a href="index.html">Vissza a főoldalra</a></nav></header>
<main class="card">
<h1 id="title">Belépés</h1>
<p class="muted" id="sub">Üdv újra! Add meg az adataidat.</p>
<div class="tabs"><button class="chip" id="t1" aria-pressed="true">Belépés</button><button class="chip" id="t2" aria-pressed="false">Új fiók</button></div>
<div id="nameRow" hidden><label for="nev">Becenév</label><input id="nev" autocomplete="nickname"></div>
<label for="email">E-mail cím</label><input id="email" type="email" autocomplete="email">
<label for="jelszo">Jelszó</label><input id="jelszo" type="password" autocomplete="current-password">
<p style="margin-top:20px"><button class="btn" id="go">Belépek</button></p>
<p class="msg" id="msg" role="status"></p>
</main></div>
<script>
let reg=false;
function mode(r){reg=r;
 document.getElementById('nameRow').hidden=!r;
 document.getElementById('title').textContent=r?'Új fiók':'Belépés';
 document.getElementById('go').textContent=r?'Fiókot hozok létre':'Belépek';
 document.getElementById('t1').setAttribute('aria-pressed',!r);
 document.getElementById('t2').setAttribute('aria-pressed',r);}
t1.onclick=()=>mode(false);t2.onclick=()=>mode(true);
go.onclick=()=>{const ok=email.value.includes('@')&&jelszo.value.length>=6;
 msg.textContent=ok?'Ez még csak egy minta, nem mentettünk el semmit. Menj tovább: ':'Adj meg érvényes e-mail címet és legalább 6 karakteres jelszót.';
 if(ok){const a=document.createElement('a');a.href='keresek.html';a.textContent='Mit keresel?';msg.appendChild(a);}};
</script></body></html>
